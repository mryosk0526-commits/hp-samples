<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>見本のページ</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f4f2;color:#2a2a2a;font-family:"Yu Gothic UI","Hiragino Sans",sans-serif}
  .box{max-width:520px;margin:24px;padding:36px 32px;background:#fff;border:2px dashed #b9b9b3;border-radius:14px;text-align:center}
  .tag{display:inline-block;font-size:13px;font-weight:700;color:#6a6a64;border:1px solid #b9b9b3;border-radius:999px;padding:4px 14px}
  h1{font-size:22px;margin:18px 0 12px;line-height:1.6}
  p{font-size:15px;line-height:1.9;color:#555;margin:0 0 10px}
  a{color:#1f3a5f}
</style>
</head>
<body>
<div class="box">
  <span class="tag">見本のページ</span>
  <h1 id="t">ここが、行き先のページになります</h1>
  <p id="d">このボタンの行き先を、あなたのお店のページのURLに替えてください。</p>
  <p><a href="javascript:history.back()">← 前のページに戻る</a></p>
</div>
<script>
  // どのボタンから来たかで、文言だけ変える（各サービスの画面には似せない）
  var M = {
    reserve: ["ここが、ネット予約のページになります", "ホットペッパーグルメなど、お使いの予約サービスの、あなたのお店のページのURLに替えてください。"],
    takeout: ["ここが、お持ち帰りの予約ページになります", "お持ち帰りの受付に使っているページのURLに替えてください。"],
    instagram: ["ここが、Instagram のページになります", "あなたのお店の Instagram のプロフィールのURLに替えてください。"],
    line: ["ここが、LINE の友だち追加になります", "LINE公式アカウントの、友だち追加用のURLに替えてください。"],
    delivery: ["ここが、出前の注文ページになります", "お使いのデリバリーサービスの、あなたのお店のページのURLに替えてください。"],
  };
  var to = new URLSearchParams(location.search).get("to");
  if (M[to]) { document.getElementById("t").textContent = M[to][0]; document.getElementById("d").textContent = M[to][1]; }
</script>
</body>
</html>
